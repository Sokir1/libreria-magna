<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Mi Perfil | Librería Magna</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body class="app-page">
 <header id="navbar"></header>

 <main class="container py-4">
   <div class="row justify-content-center">
     <div class="col-md-8 col-lg-6">
       <h2 class="mb-4"> Mi Perfil</h2>

       <div class="card p-4 mb-4">
         <div class="text-center mb-4">
           <div style="font-size:4rem;"></div>
           <h3 id="user-name">Cargando...</h3>
           <p class="text-suave" id="user-email">-</p>
           <span class="badge bg-secondary" id="user-role">-</span>
         </div>

         <hr>

         <div class="row text-center mt-3">
           <div class="col-4">
             <div class="stat-number" id="profile-total" style="font-size:1.8rem;">0</div>
             <div class="stat-label">Libros</div>
           </div>
           <div class="col-4">
             <div class="stat-number" id="profile-leidos" style="font-size:1.8rem;">0</div>
             <div class="stat-label">Leídos</div>
           </div>
           <div class="col-4">
             <div class="stat-number" id="profile-leyendo" style="font-size:1.8rem;">0</div>
             <div class="stat-label">Leyendo</div>
           </div>
         </div>

         <hr>

         <p class="text-suave small text-center mt-3">
           Miembro desde: <span id="user-since">-</span>
         </p>
       </div>

       <div class="text-center">
         <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
       </div>
     </div>
   </div>
 </main>

 <div id="footer"></div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="/js/main.js"></script>
 <script src="/js/profile.js"></script>
</body>
</html>
