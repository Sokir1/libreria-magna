<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Admin | Librería Magna</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body class="app-page">
 <header id="navbar"></header>

 <main class="container py-4">
   <h2 class="mb-4">Panel de Administración</h2>

   <!-- Estadísticas globales -->
   <div class="row g-3 mb-4">
     <div class="col-md-4">
       <div class="stat-card">
         <div class="stat-number" id="admin-total-users">0</div>
         <div class="stat-label">Usuarios registrados</div>
       </div>
     </div>
     <div class="col-md-4">
       <div class="stat-card">
         <div class="stat-number" id="admin-total-books">0</div>
         <div class="stat-label">Total de libros</div>
       </div>
     </div>
     <div class="col-md-4">
       <div class="stat-card">
         <div class="stat-number" id="admin-total-leidos">0</div>
         <div class="stat-label">Libros leídos</div>
       </div>
     </div>
   </div>

   <!-- Gestión de usuarios -->
   <div class="card p-4">
     <h4 class="mb-3"> Gestión de Usuarios</h4>
     <div class="table-responsive">
       <table class="table table-hover">
         <thead>
           <tr>
             <th>ID</th>
             <th>Nombre</th>
             <th>Correo</th>
             <th>Rol</th>
             <th>Registro</th>
             <th>Acciones</th>
           </tr>
         </thead>
         <tbody id="users-table">
           <tr>
             <td colspan="6" class="text-center text-suave">Cargando usuarios...</td>
           </tr>
         </tbody>
       </table>
     </div>
   </div>
 </main>

 <div id="footer"></div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="/js/main.js"></script>
 <script src="/js/admin.js"></script>
</body>
</html>
