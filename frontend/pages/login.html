<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Iniciar sesion | Libreria Magna</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body class="app-page">
 <header id="navbar"></header>

 <main>
   <div class="form-auth">
     <div class="card p-4">
       <h2 class="text-center mb-1">Iniciar sesion</h2>
       <p class="text-center text-suave mb-4">Entra con tu correo y contrasena</p>

       <!-- Alerta de error de Google -->
       <div id="google-error" class="alert alert-warning d-none" role="alert"></div>

       <form id="login-form" novalidate>
         <div class="mb-3">
           <label for="email" class="form-label">Correo electronico</label>
           <input type="email" class="form-control" id="email" placeholder="tu@correo.com" required>
           <div class="invalid-feedback">Ingresa un correo valido.</div>
         </div>
         <div class="mb-3">
           <label for="password" class="form-label">Contrasena</label>
           <input type="password" class="form-control" id="password" placeholder="Minimo 6 caracteres" required>
           <div class="invalid-feedback">La contrasena es obligatoria.</div>
         </div>
         <button type="submit" class="btn btn-primary w-100">Entrar</button>
       </form>

       <!-- Separador -->
       <div class="d-flex align-items-center my-3">
         <hr class="flex-grow-1"><span class="px-2 text-suave small">o</span><hr class="flex-grow-1">
       </div>

       <!-- Login con Google -->
       <a href="/api/auth/google" id="btn-google" class="btn btn-outline-dark w-100">
         <svg width="18" height="18" viewBox="0 0 48 48" class="me-2" style="vertical-align:middle;">
           <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c11 0 20.5-8 20.5-21 0-1.4-.2-2.7-.4-3.9z"/>
           <path fill="#FF3D00" d="M6.3 14.7l6.9 5.1C14.7 16.2 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l6-6C34.6 5.1 29.6 3 24 3 15.4 3 8.1 7.7 6.3 14.7z"/>
           <path fill="#4CAF50" d="M24 45c5.4 0 10.3-1.8 14.1-5l-6.5-5.5C29.5 36.2 26.9 37 24 37c-5.4 0-10-3.6-11.6-8.5l-6.8 5.3C8 41.5 15.5 45 24 45z"/>
           <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-1.1 3.1-3.5 5.6-6.4 7l6.5 5.5c4.5-4.2 7.1-10.5 7.1-17.5 0-1.4-.2-2.7-.4-3.9z"/>
         </svg>
         Continuar con Google
       </a>

       <p class="text-center mt-3 mb-0 text-suave">
         No tienes cuenta? <a href="register.html">Registrate aqui</a>
       </p>
     </div>
   </div>
 </main>

 <div id="footer"></div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="/js/main.js"></script>
 <script src="/js/auth.js"></script>
</body>
</html>
