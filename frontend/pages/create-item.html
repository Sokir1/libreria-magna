<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Agregar Libro | Librería Magna</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body class="app-page" style="--page-bg: url('/assets/img/hercules-flipped.jpg'); --page-brightness: 0.48;">
 <header id="navbar"></header>

 <main class="container py-4">
   <div class="row justify-content-center">
     <div class="col-md-8 col-lg-6">
       <h2 class="mb-4"> Agregar nuevo libro</h2>

       <div class="card p-4">
         <form id="book-form" novalidate>
           <div class="mb-3">
             <label for="title" class="form-label">Título *</label>
             <input type="text" class="form-control" id="title" placeholder="Ej: Cien años de soledad" required>
           </div>
           <div class="mb-3">
             <label for="author" class="form-label">Autor *</label>
             <input type="text" class="form-control" id="author" placeholder="Ej: Gabriel García Márquez" required>
           </div>
           <div class="row">
             <div class="col-md-6 mb-3">
               <label for="genre" class="form-label">Género</label>
               <select class="form-select" id="genre">
                 <option value="General">General</option>
                 <option value="Ficción">Ficción</option>
                 <option value="No ficción">No ficción</option>
                 <option value="Fantasía">Fantasía</option>
                 <option value="Ciencia ficción">Ciencia ficción</option>
                 <option value="Romance">Romance</option>
                 <option value="Terror">Terror</option>
                 <option value="Misterio">Misterio</option>
                 <option value="Historia">Historia</option>
                 <option value="Biografía">Biografía</option>
                 <option value="Ciencia">Ciencia</option>
                 <option value="Tecnología">Tecnología</option>
                 <option value="Autoayuda">Autoayuda</option>
                 <option value="Poesía">Poesía</option>
                 <option value="Cómic">Cómic</option>
                 <option value="Otro">Otro</option>
               </select>
             </div>
             <div class="col-md-6 mb-3">
               <label for="status" class="form-label">Estado</label>
               <select class="form-select" id="status">
                 <option value="por_leer"> Por leer</option>
                 <option value="leyendo"> Leyendo</option>
                 <option value="leido">Leído</option>
                 <option value="abandonado"> Abandonado</option>
               </select>
             </div>
           </div>
           <div class="mb-3">
             <label for="rating" class="form-label">Calificación (0-5 estrellas)</label>
             <select class="form-select" id="rating">
               <option value="0">Sin calificar</option>
               <option value="1">1</option>
               <option value="2">2</option>
               <option value="3">3</option>
               <option value="4">4</option>
               <option value="5">5</option>
             </select>
           </div>
           <div class="mb-3">
             <label for="cover_url" class="form-label">URL de portada (opcional)</label>
             <input type="url" class="form-control" id="cover_url" placeholder="https://ejemplo.com/portada.jpg">
           </div>
           <div class="mb-3">
             <label for="notes" class="form-label">Notas personales</label>
             <textarea class="form-control" id="notes" rows="3" placeholder="¿Qué te pareció? ¿Qué aprendiste?"></textarea>
           </div>
           <button type="submit" class="btn btn-primary w-100">Guardar libro</button>
         </form>
       </div>
     </div>
   </div>
 </main>

 <div id="footer"></div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="/js/main.js"></script>
 <script src="/js/books.js"></script>
</body>
</html>
